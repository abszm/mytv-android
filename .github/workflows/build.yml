name: Build APK

on:
  push:
    branches: [main, master, next]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate CI keystore
        run: |
          keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/ci-release.jks" \
            -storepass android -keypass android -alias cikey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=mytv-android-ci"

      - name: Build debug APK
        run: ./gradlew :tv:assembleDebug :mobile:assembleDebug --stacktrace

      - name: Build beta release APK (CI keystore 签名)
        run: ./gradlew :tv:assembleRelease --stacktrace -Papp.versionSuffix=-beta
        env:
          KEYSTORE: ${{ github.workspace }}/ci-release.jks
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: cikey
          KEY_PASSWORD: android

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mytv-android-apks
          path: |
            tv/build/outputs/apk/debug/*.apk
            tv/build/outputs/apk/release/*.apk
            mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish beta pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls tv/build/outputs/apk/release/*.apk | head -1)
          VERSION=$(basename "$APK" | sed -E 's/.*mytv-android-tv-(.*)-all-sdk[0-9]+\.apk/\1/')
          gh release delete "v$VERSION" --yes --cleanup-tag || true
          gh release create "v$VERSION" --prerelease --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes "自动构建的 beta 测试版本（CI 签名）。覆盖安装如失败请先卸载旧版。" \
            "$APK"
